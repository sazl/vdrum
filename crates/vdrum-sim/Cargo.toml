[package]
name = "vdrum-sim"
description = "Simulator of VDrum's Launch Control XL 3 surface: the surface, a virtual device and a stand-in for the plugin, driven by JSON commands (native and WebAssembly)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
lcxl3 = { path = "../lcxl3" }
lxr-params = { path = "../lxr-params" }
vdrum-surface = { path = "../vdrum-surface" }
serde_json = "1"
