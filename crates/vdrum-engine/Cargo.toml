[package]
name = "vdrum-engine"
description = "VDrum's engine wrapper, sequencer data, kit library and LXR-02 file formats, shared by the plugin and the Ableton Move module (no I/O threads, no plugin framework)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lxr-core = { path = "../lxr-core" }
lxr-params = { path = "../lxr-params" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
