<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" role="img" aria-label="The plugin owns the controller port; the host only supplies notes and automation" font-size="13" font-family="sans-serif">
  <rect width="760" height="360" fill="#ffffff"/>
  <defs>
    <marker id="arch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8a8a8a"/>
    </marker>
  </defs>
  <text x="24" y="34" font-size="15" font-weight="600" fill="#1f1f1f">The plugin owns the controller port; the host only supplies notes and automation</text>
  <g fill="none" stroke="#8a8a8a" stroke-width="1.25">
    <path d="M204 110H284" marker-end="url(#arch-arrow)"/>
    <path d="M284 150H204" marker-end="url(#arch-arrow)"/>
    <path d="M504 110H584" marker-end="url(#arch-arrow)"/>
    <path d="M584 150H504" marker-end="url(#arch-arrow)"/>
    <path d="M690 260V184" marker-end="url(#arch-arrow)"/>
    <path d="M604 184V296H504" marker-end="url(#arch-arrow)"/>
    <path d="M504 316H624" marker-end="url(#arch-arrow)"/>
  </g>
  <g>
    <rect x="24" y="64" width="180" height="120" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
    <text x="114" y="88" text-anchor="middle" font-weight="600" fill="#1f1f1f">Launch Control XL 3</text>
    <text x="114" y="108" text-anchor="middle" font-size="11.5" fill="#5f5f5f">DAW mode</text>
    <text x="114" y="124" text-anchor="middle" font-size="11.5" fill="#5f5f5f">DAW In/Out USB port</text>
  </g>
  <g>
    <rect x="284" y="64" width="220" height="120" rx="8" fill="#2f6fd6" fill-opacity="0.12" stroke="#2f6fd6" stroke-width="2"/>
    <text x="394" y="88" text-anchor="middle" font-weight="600" fill="#1f1f1f">Controller thread (new)</text>
    <text x="394" y="108" text-anchor="middle" font-size="11.5" fill="#1f1f1f">midir: owns the DAW port</text>
    <text x="394" y="124" text-anchor="middle" font-size="11.5" fill="#1f1f1f">lcxl3: message codec</text>
    <text x="394" y="140" text-anchor="middle" font-size="11.5" fill="#1f1f1f">vdrum-surface: 10 modes,</text>
    <text x="394" y="156" text-anchor="middle" font-size="11.5" fill="#1f1f1f">pickup, LEDs, screen text</text>
  </g>
  <g>
    <rect x="584" y="64" width="152" height="120" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
    <text x="660" y="88" text-anchor="middle" font-weight="600" fill="#1f1f1f">Audio thread</text>
    <text x="660" y="108" text-anchor="middle" font-size="11.5" fill="#5f5f5f">lxr-core engine</text>
    <text x="660" y="124" text-anchor="middle" font-size="11.5" fill="#5f5f5f">command queue in</text>
    <text x="660" y="140" text-anchor="middle" font-size="11.5" fill="#5f5f5f">change flags out</text>
  </g>
  <g>
    <rect x="284" y="260" width="220" height="72" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
    <text x="394" y="284" text-anchor="middle" font-weight="600" fill="#1f1f1f">Editor (GUI)</text>
    <text x="394" y="304" text-anchor="middle" font-size="11.5" fill="#5f5f5f">copies engine changes to</text>
    <text x="394" y="320" text-anchor="middle" font-size="11.5" fill="#5f5f5f">host parameters (while open)</text>
  </g>
  <g>
    <rect x="624" y="260" width="112" height="72" rx="8" fill="none" stroke="#8a8a8a" stroke-width="1.25"/>
    <text x="680" y="284" text-anchor="middle" font-weight="600" fill="#1f1f1f">Host</text>
    <text x="680" y="304" text-anchor="middle" font-size="11.5" fill="#5f5f5f">MIDI notes,</text>
    <text x="680" y="320" text-anchor="middle" font-size="11.5" fill="#5f5f5f">automation</text>
  </g>
  <g font-size="11.5" fill="#5f5f5f">
    <text x="244" y="102" text-anchor="middle">controls</text>
    <text x="244" y="142" text-anchor="middle">LED, screen</text>
    <text x="544" y="102" text-anchor="middle">param writes</text>
    <text x="544" y="142" text-anchor="middle">changes</text>
    <text x="682" y="228" text-anchor="end">MIDI in</text>
    <text x="554" y="288" text-anchor="middle">changes</text>
    <text x="564" y="334" text-anchor="middle">host params</text>
  </g>
</svg>
