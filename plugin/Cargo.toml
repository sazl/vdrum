[package]
name = "vdrum"
description = "VDrum: drum synthesizer plugin built on a port of the LXR-02 sound engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "vdrum"
path = "src/main.rs"

[features]
default = []
# Panic on allocations in the audio thread (debug builds only); used for validation.
assert_process_allocs = ["nih_plug/assert_process_allocs"]

[dependencies]
lxr-core = { path = "../crates/lxr-core" }
lxr-params = { path = "../crates/lxr-params" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", features = ["standalone"] }
# Vendored with fixes for zoom and resizing; see third_party/README.md.
nih_plug_egui = { path = "../third_party/nih_plug_egui" }
rubato = "0.16.2"
crossbeam-queue = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[dev-dependencies]
sha2 = "0.10"
