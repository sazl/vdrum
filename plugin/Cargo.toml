[package]
name = "vdrum"
description = "VDrum: drum synthesizer plugin built on a port of the LXR-02 sound engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "vdrum"
path = "src/main.rs"

[features]
default = []
# Panic on allocations in the audio thread (debug builds only); used for validation.
assert_process_allocs = ["nih_plug/assert_process_allocs"]

[dependencies]
lxr-core = { path = "../crates/lxr-core" }
lxr-params = { path = "../crates/lxr-params" }
vdrum-engine = { path = "../crates/vdrum-engine" }
nih_plug = { git = "https://github.com/robbert-vdh/nih-plug.git", rev = "de421011f41a6d10fc8c7a6084e4f4dee0143683", features = ["standalone"] }
# Vendored with fixes for zoom and resizing; see third_party/README.md.
nih_plug_egui = { path = "../third_party/nih_plug_egui" }
rubato = "0.16.2"
# The standalone reads the default output device's rate (src/main.rs); the version nih-plug uses.
cpal = "0.15"
crossbeam-queue = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
# Launch Control XL 3 (controller thread).
# Launch Control XL 3 (controller thread); the version nih-plug's standalone already uses.
midir = "0.9"
lcxl3 = { path = "../crates/lcxl3" }
vdrum-surface = { path = "../crates/vdrum-surface" }

[dev-dependencies]
sha2 = "0.10"
